<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>
<div>
    <th:block th:each="car : ${cars}">
        <h1 th:text="${car.getModel()}" ></h1>
        <ul>
            <li th:text="${car.getMake()}"></li>
            <li th:text="${car.getYear()}"></li>
        </ul>
    </th:block>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layboot}">

<div layout:fragment="content">
    <!-- Page Header with Actions -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Управление пользователями</h2>
        </div>
        <div class="btn-group">
            <a th:href="@{/adduser}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Добавить пользователя
            </a>
        </div>
    </div>

    <!-- Навигация табов -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                    data-bs-target="#home" type="button" role="tab" aria-controls="home"
                    aria-selected="true">
                <i class="bi bi-people me-2"></i>
                Пользователи
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                    data-bs-target="#profile" type="button" role="tab"
                    aria-controls="profile" aria-selected="false">
                <i class="bi bi-person-plus me-2"></i>
                Новый
            </button>
        </li>
    </ul>

    <!-- Контент табов -->
    <div class="tab-content p-4 border border-top-0 rounded-bottom" id="myTabContent">
        <!-- Таб 1 -->
        <div class="tab-pane fade show active" id="home" role="tabpanel"
             aria-labelledby="home-tab">


            <div class="card">
                <div class="card-header">
                    <p class="text-muted mb-0">Всего пользователей: <strong th:text="${#lists.size(users)}">0</strong>
                    </p>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя</th>
                                <th>Почта</th>
                                <th>Роли</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <th:block th:each="user : ${users}">
                                <tr th:object="${user}">
                                    <td th:text="*{Id}">1</td>
                                    <td th:text="*{FirstName + ' ' + LastName}">Иван Петров</td>
                                    <td th:text="*{Email}">Email</td>
                                    <td th:text="${user.roles.isEmpty() ? 'No Roles' : #strings.listJoin(user.getRoleNames(), ', ')}">Roles</td>
                                    <td>
                                        <button type="button" class="btn btn-outline-secondary" th:onclick="|window.location.href='@{/edituser?id=}*{Id}'|">
                                            <i class="bi bi-pencil"></i> Edit</button>
                                        <button class="btn btn-outline-danger" type="button" th:onclick="|window.location.href='@{/removeuser?id=}*{Id}'|">
                                            <i class="bi bi-trash"></i> Remove</button>
                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Таб 2 -->
        <div class="tab-pane fade" id="profile" role="tabpanel"
             aria-labelledby="profile-tab">
            <div th:insert="~{frags :: add-user(true)}"></div>
        </div>

    </div>
</div>

</html>

<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layboot}">

<div layout:fragment="content">

    <!-- Модальное окно редактирования -->
    <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editUserForm">
                        <!-- Скрытое поле с ID -->
                        <input type="hidden" id="editUserId" name="id">

                        <div class="mb-3">
                            <label for="editFirstName" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="editFirstName" name="firstName" required>
                        </div>

                        <div class="mb-3">
                            <label for="editLastName" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="editLastName" name="lastName" required>
                        </div>

                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail" name="email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Роли </label>
                            <div id="rolesContainer" class="border rounded p-3"
                                 style="max-height: 200px; overflow-y: auto;">
                                <!-- Чекбоксы появятся здесь через JS -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveChangesBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания -->
    <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить нового пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUserForm">
                        <div class="mb-3">
                            <label for="addFirstName" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="addFirstName" name="firstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="addLastName" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="addLastName" name="lastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="addEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="addEmail" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="addPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="addPassword" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Роли</label>
                            <div id="addRolesContainer" class="border rounded p-3">
                                <div th:each="role : ${allRoles}" class="form-check">
                                    <input class="form-check-input" type="checkbox"
                                           name="roles"
                                           th:value="${role.id}"
                                           th:id="${'roleAdd' + role.id}"
                                           th:data-name="${role.name}">
                                    <label class="form-check-label" th:for="${'roleAdd' + role.id}"
                                           th:text="${role.name}">
                                        ROLE_USER
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-success" id="confirmAddBtn">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Header with Actions -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Управление пользователями</h2>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                <i class="bi bi-person-plus"></i> Добавить пользователя
            </button>
        </div>
    </div>

    <!-- Навигация табов -->
    <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                    data-bs-target="#home" type="button" role="tab" aria-controls="home"
                    aria-selected="true">
                <i class="bi bi-people me-2"></i>
                Пользователи
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                    data-bs-target="#profile" type="button" role="tab"
                    aria-controls="profile" aria-selected="false">
                <i class="bi bi-person-plus me-2"></i>
                Новый
            </button>
        </li>
    </ul>

    <!-- Контент табов -->
    <div class="tab-content p-4 border border-top-0 rounded-bottom" id="myTabContent">
        <!-- Таб 1 -->
        <div class="tab-pane fade show active" id="home" role="tabpanel"
             aria-labelledby="home-tab">


            <div class="card">
                <div class="card-header">
                    <p class="text-muted mb-0">Всего пользователей: <strong th:text="${#lists.size(users)}">0</strong>
                    </p>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя</th>
                                <th>Почта</th>
                                <th>Роли</th>
                                <th>Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <th:block th:each="user : ${users}">
                                <tr th:object="${user}">
                                    <td th:text="*{Id}">1</td>
                                    <td th:text="*{FirstName + ' ' + LastName}">Иван Петров</td>
                                    <td th:text="*{Email}">Email</td>
                                    <td th:text="${user.roles.isEmpty() ? 'No Roles' : #strings.listJoin(user.getRoleNames(), ', ')}">
                                        Roles
                                    </td>
                                    <td>
                                        <button type="button" class="btn btn-outline-secondary edit-btn"
                                                th:data-id="${user.id}"
                                                th:data-firstname="${user.firstName}"
                                                th:data-lastname="${user.lastName}"
                                                th:data-email="${user.email}"
                                                th:data-roles="${#strings.listJoin(user.getRoleNames(), ', ')}">
                                            <i class="bi bi-pencil"></i> Edit
                                        </button>
                                        <button class="btn btn-outline-danger delete-btn" type="button"
                                                th:data-user-id="${user.id}">
                                            <i class="bi bi-trash"></i> Remove
                                        </button>
                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Таб 2 -->
        <div class="tab-pane fade" id="profile" role="tabpanel"
             aria-labelledby="profile-tab">
            <div th:insert="~{frags :: add-user(true)}"></div>
        </div>

    </div>
</div>

<script layout:fragment="script">


    $(document).ready(function() {

        const API_BASE = '/api/users';
        // Инициализация модального окна Bootstrap
        const editModal = new bootstrap.Modal(document.getElementById('editUserModal'));



        // Получаем доступные роли (если есть)
        let availableRoles = [];
        try {
            // Если есть глобальная переменная с ролями
            if (typeof window.AVAILABLE_ROLES !== 'undefined') {
                availableRoles = window.AVAILABLE_ROLES;
            }
        } catch(e) {}

        if (availableRoles.length > 0) {
            $('#availableRoles').text(availableRoles.join(', '));
        }

        // === ОТКРЫТИЕ МОДАЛЬНОГО ОКНА ДЛЯ РЕДАКТИРОВАНИЯ ===
          $(document).on('click', '.edit-btn', function() {
            const $btn = $(this);

            // Получаем данные пользователя
            const userData = {
                id: $btn.data('id'),
                firstName: $btn.data('firstname'),
                lastName: $btn.data('lastname'),
                email: $btn.data('email'),
                roles: ($btn.data('roles') || '')
                    .split(',')
                    .map(r => r.trim())
                    .filter(r => r)
            };

            console.log('Данные пользователя:', userData);

            // Заполняем форму
            fillEditForm(userData);

            // Показываем модальное окно
            editModal.show();
        });

        // === СОХРАНЕНИЕ ИЗМЕНЕНИЙ ===
        $('#saveChangesBtn').click(function() {
            saveUserChanges();
        });

    /**
     * Сохраняет изменения пользователя
     */

    function saveUserChanges() {
        const $btn = $('#saveChangesBtn');
        const $btnText = $btn.find('.btn-text');
        const $spinner = $btn.find('.spinner-border');

        // Показываем спиннер
        $btnText.addClass('d-none');
        $spinner.removeClass('d-none');
        $btn.prop('disabled', true);

        // Собираем данные
        const formData = {
            id: $('#editUserId').val(),
            firstName: $('#editFirstName').val().trim(),
            lastName: $('#editLastName').val().trim(),
            email: $('#editEmail').val().trim(),
            roles: getSelectedRoles()
        };

        console.log('Отправляемые данные:', formData);

        // Отправляем запрос
        $.ajax({
            url: `${API_BASE}/${formData.id}`,
            method: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(response) {
                // Закрываем модалку
                editModal.hide();

                // Обновляем строку в таблице
                updateUserInTable(response);

                // Показываем уведомление
                showSuccessAlert('Пользователь успешно обновлён!');
            },
            error: function(xhr) {
                showErrorAlert('Ошибка сохранения: ' + getErrorMessage(xhr));
            },
            complete: function() {
                resetSaveButton($btn, $btnText, $spinner);
            }
        });
    }

// Обработка кнопки "Создать" в модальном окне
$('#confirmAddBtn').on('click', function() {
    const $form = $('#addUserForm');

    // 1. Проверка валидности (HTML5 validation)
    if (!$form[0].checkValidity()) {
        $form[0].reportValidity();
        return;
    }

    // 2. Сбор основных данных формы в объект
    let userData = {};
    const formData = $form.serializeArray();
    $.each(formData, function() {
        userData[this.name] = this.value;
    });

    // 3. Сбор выбранных ролей (массив объектов для Spring/Jackson)
    userData.roles = [];
    $('#addRolesContainer input[type="checkbox"]:checked').each(function() {
        userData.roles.push({
            id: $(this).val(),
            name: $(this).data('name') // если в чекбоксе есть data-name="ROLE_USER"
        });
    });

    // 4. Отправка AJAX (POST)
    $.ajax({
        url: `${API_BASE}/save`,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(userData),
        success: function() {
            $('#addUserModal').modal('hide');
            location.reload();
        },
        error: function(xhr) {
            alert('Ошибка при создании пользователя: ' + xhr.responseText);
        }
    });
});

    /**
     * Обновляет пользователя в таблице
     */
    function updateUserInTable(user) {
        const $row = $(`button.edit-btn[data-id="${user.id}"]`).closest('tr');

        if ($row.length === 0) {
            console.warn('Строка пользователя не найдена');
            return;
        }

        // Обновляем данные в ячейках
        $row.find('td:nth-child(2)').text(`${user.firstName} ${user.lastName}`);
        $row.find('td:nth-child(3)').text(user.email);

        // Форматируем роли
        const rolesText = user.roles && user.roles.length > 0
            ? user.roles.map(r => r.name || r).join(', ')
            : 'No Roles';
        $row.find('td:nth-child(4)').text(rolesText);

        // Обновляем data-атрибуты кнопки
        const $editBtn = $row.find('.edit-btn');
        $editBtn.data('firstname', user.firstName);
        $editBtn.data('lastname', user.lastName);
        $editBtn.data('email', user.email);
        $editBtn.data('roles', rolesText);

        // Подсвечиваем строку
        highlightRow($row);
    }

    function highlightRow($row) {
        $row.addClass('table-success');
        setTimeout(() => {
            $row.removeClass('table-success');
        }, 2000);
    }

    /**
     * Получает выбранные роли из чекбоксов
     */
    function getSelectedRoles() {
        const selectedRoles = [];
        $('.role-checkbox:checked').each(function() {
            selectedRoles.push($(this).val());
        });
        return selectedRoles;
    }

        // === ОБНОВЛЕНИЕ СТРОКИ ТАБЛИЦЫ ===
        function updateTableRow(user) {
            const $row = $(`button[data-id="${user.id}"]`).closest('tr');

            // Форматируем роли
            const rolesText = user.roles && user.roles.length > 0
                ? user.roles.map(r => r.name || r).join(', ')
                : 'No Roles';

            // Обновляем ячейки
            $row.find('td:nth-child(2)').text(`${user.firstName} ${user.lastName}`);
            $row.find('td:nth-child(3)').text(user.email);
            $row.find('td:nth-child(4)').text(rolesText);

            // Обновляем data-атрибуты кнопки
            $row.find('.edit-btn')
                .data('firstname', user.firstName)
                .data('lastname', user.lastName)
                .data('email', user.email)
                .data('roles', user.roles.map(r => r.name || r).join(', '));

            // Добавляем анимацию
            $row.addClass('table-success');
            setTimeout(() => $row.removeClass('table-success'), 2000);
        }

        // Удаление пользователя
        $(document).on('click', '.delete-btn', function() {
            const userId = $(this).data('user-id');
            const userName = $(this).closest('tr').find('td:nth-child(2)').text();

            if (confirm(`Удалить пользователя "${userName}"?`)) {
                $.ajax({
                    url: `${API_BASE}/${userId}`,
                    method: 'DELETE',
                    success: () => {
                        $(this).closest('tr').fadeOut(300, function() {
                            $(this).remove();
                            updateTotalCount();
                        });
                    },
                    error: (xhr) => {
                        alert('Ошибка удаления: ' + xhr.statusText);
                    }
                });
            }
        });


        // Обновление общего счетчика
        function updateTotalCount() {
            const count = $('tbody tr:visible').length;
            $('.card-header strong').text(count);
        }

        // Очистка формы при закрытии модального окна
        $('#editUserModal').on('hidden.bs.modal', function() {
            $('#editUserForm')[0].reset();
        });

    function fillEditForm(userData) {
        // Основные поля
        $('#editUserId').val(userData.id);
        $('#editFirstName').val(userData.firstName);
        $('#editLastName').val(userData.lastName);
        $('#editEmail').val(userData.email);

        // Рендерим чекбоксы ролей
        renderRoleCheckboxes(userData.roles);
    }

    /**
     * Рендерит чекбоксы ролей
     */
    function renderRoleCheckboxes(userRoles) {
        const $container = $('#rolesContainer');
        $container.empty();

        if (!ALL_ROLES || ALL_ROLES.length === 0) {
            $container.html('<div class="text-muted">Нет доступных ролей</div>');
            return;
        }

        ALL_ROLES.forEach(role => {
            // Проверяем, есть ли роль у пользователя
            const isChecked = userRoles.includes(role);

            const $checkbox = $(`
                <div class="form-check mb-2">
                    <input class="form-check-input role-checkbox"
                           type="checkbox"
                           value="${role}"
                           id="role_${role}"
                           ${isChecked ? 'checked' : ''}>
                    <label class="form-check-label" for="role_${role}">
                        ${role}
                    </label>
                </div>
            `);

            $container.append($checkbox);
        });
    }

    function resetSaveButton($btn, $btnText, $spinner) {
        $btnText.removeClass('d-none');
        $spinner.addClass('d-none');
        $btn.prop('disabled', false);
    }

    function showSuccessAlert(message) {
        showAlert(message, 'success');
    }

    function showErrorAlert(message) {
        showAlert(message, 'danger');
    }

    function showAlert(message, type) {
        // Удаляем старые алерты
        $('.auto-alert').remove();

        // Создаём новый алерт
        const $alert = $(`
            <div class="alert alert-${type} alert-dismissible fade show auto-alert"
                 role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999;">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `);

        $('body').append($alert);

        // Автоматически скрываем через 5 секунд
        setTimeout(() => {
            $alert.alert('close');
        }, 5000);
    }

    });
</script>

</html>

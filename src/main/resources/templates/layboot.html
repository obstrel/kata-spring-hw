<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title th:text="${pageTitle} + ' | My layout'">User Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (версия 1.8.0 или выше) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">


</head>
<body>


<div class="container">

    <!-- Заголовок -->
    <div class="d-flex justify-content-between align-items-center mb-2 py-4 mb-4 bg-primary text-white">
        <h2 class="ms-3"><span sec:authentication="principal.email"></span> with roles:
            <span th:text="${currentUserRoles.isEmpty() ? 'No Roles' : #strings.listJoin(currentUserRoles, ', ')}">ADMIN</span>
        </h2>
        <div class="btn-group">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-escape"></i> Logout</button>
            </form>
        </div>
    </div>

    <!-- Две колонки -->
    <div class="row">

        <!-- Левая колонка (sidebar) -->
        <div class="col-md-3">
            <div class="sidebar">
                <h5>Меню</h5>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/user}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:if="${#lists.contains(currentUserRoles, 'ADMIN')}" th:href="@{/users}">Пользователи</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Правая колонка (контент) -->
        <div class="col-md-9">
            <div class="content">
                <!-- Контент будет здесь -->
                <div layout:fragment="content"></div>
            </div>
        </div>

    </div>

</div>

<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

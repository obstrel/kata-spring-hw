<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | User Admin'">User Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">

    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .sidebar .nav-link {
            color: #333;
            padding: 12px 20px;
            border-radius: 5px;
            margin: 2px 10px;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        .main-content {
            background-color: #f5f7f9;
            min-height: 100vh;
        }
        .navbar-brand {
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- Main Container -->
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar Navigation -->
        <nav class="col-md-3 col-lg-2 sidebar d-md-block">
            <div class="position-sticky pt-3">

                <!-- Brand -->
                <div class="text-center mb-4">
                    <h5 class="navbar-brand text-primary">
                        <i class="bi bi-people-fill"></i>
                        User Admin
                    </h5>
                </div>

                <!-- Navigation Menu -->
                <ul class="nav flex-column">

                    <!-- Dashboard -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"
                           th:classappend="${activePage == 'dashboard'} ? 'active'">
                            <i class="bi bi-speedometer2"></i>
                            Dashboard
                        </a>
                    </li>

                    <!-- Users -->
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}"
                           th:classappend="${activePage == 'users'} ? 'active'">
                            <i class="bi bi-people"></i>
                            Пользователи
                        </a>
                    </li>

                    <!-- Divider -->
                    <li class="nav-item mt-4">
                        <hr class="dropdown-divider">
                    </li>

                    <!-- User Info -->
                    <li class="nav-item">
                        <div class="nav-link text-muted">
                            <small>
                                <i class="bi bi-person-circle"></i>
                                <span sec:authentication="name">User</span>
                            </small>
                        </div>
                    </li>

                    <!-- Logout -->
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="nav-link btn btn-link text-danger p-0" style="border: none;">
                                <i class="bi bi-box-arrow-right"></i>
                                Выйти
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content px-0">

            <!-- Top Header -->
            <div class="bg-white shadow-sm">
                <div class="container-fluid py-2">
                    <div class="row align-items-center">
                        <div class="col">
                            <h4 class="mb-0" th:text="${pageTitle}">Заголовок страницы</h4>
                        </div>
                        <div class="col-auto">
                            <div class="btn-group">
                                <!-- Additional header buttons can go here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="container-fluid py-4">

                <!-- Alert Messages -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Dynamic Content -->
                <div layout:fragment="content">
                    <!-- Content will be inserted here by child templates -->
                    <div class="text-center text-muted py-5">
                        <i class="bi bi-layout-wtf display-1"></i>
                        <h3>Содержимое страницы</h3>
                        <p>Этот контент будет заменен в дочерних шаблонах</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Additional Scripts -->
<script>
    // Activate Bootstrap tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl)
    })
</script>
</body>
</html>

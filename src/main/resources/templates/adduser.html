<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add user</title>
</head>
<body>
<h3>Add new user</h3>
<div th:insert="~{frags :: logout}"></div>

<form th:action="@{/saveuser}" th:object="${user}" method="post">
    <!-- Form fields here -->
    <ul>
        <li>
            <label title="FirstName">
                Name:
                <input name="firstName"/>
            </label>
        </li>
        <li>
            <label title="LastName">
                Last Name:
                <input name="lastName"/>
            </label>
        </li>
        <li>
            <label title="Email">
                Email:
                <input name="email"/>
            </label>
        </li>
        <li>
            <label title="Password">
                Password:
                <input name="password"/>
            </label>
        </li>
        <li>
            <label title="Roles">
                Roles:
                <th:block th:each="role : ${allRoles}">
                    <input type="checkbox" th:id="${'role_' + role.name}" th:name="roles" th:value="${role.name}"
                           th:checked="${#lists.contains(user.roles, role)}" />
                    <label th:for="${'role_' + role.name}" th:text="${role.name}"></label><br/>
                </th:block>
            </label>
        </li>
        <li>
            <button type="submit">Save User</button>
        </li>
    </ul>
</form>
</body>
</html>
